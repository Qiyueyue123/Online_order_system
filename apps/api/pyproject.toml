[project]
name = "matcha-store-api"
version = "0.1.0"
description = "FastAPI backend for the Matcha demonstration store"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.2",
  "argon2-cffi==25.1.0",
  "email-validator==2.2.0",
  "fastapi==0.115.14",
  "pillow==11.2.1",
  "pillow-heif==0.21.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "stripe==12.2.0",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
