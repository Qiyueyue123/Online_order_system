services:
  legacy:
    build: ./legacy
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      MANUAL_ORDER_ONLY: "${MANUAL_ORDER_ONLY:-1}"
      DATABASE_PATH: "/app/instance/matcha.db"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"
      PORT: "8000"
    volumes:
      - ./legacy/instance:/app/instance

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matcha
      POSTGRES_USER: matcha
      POSTGRES_PASSWORD: matcha
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcha"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://matcha:matcha@postgres:5432/matcha
      APP_SECRET: development-only-secret-change-me
      # Override in .env with your Mac's LAN IP (e.g. http://192.168.x.x:5173)
      # to test payment redirects from a phone on the same Wi-Fi.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: "false"
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      UPLOADS_DIR: /app/uploads
    ports:
      - "8001:8001"
    volumes:
      - media-uploads:/app/uploads
    depends_on:
      seed:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://matcha:matcha@postgres:5432/matcha
      APP_SECRET: development-only-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./apps/api
    command: ["python", "-m", "app.seed"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://matcha:matcha@postgres:5432/matcha
      APP_SECRET: development-only-secret-change-me
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  storefront:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
  media-uploads:
